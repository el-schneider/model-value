name: OpenCode Go docs
# Fails when the live OpenCode Go docs drift from what model-value parses. A failed run is the alert;
# it opens no issues or PRs.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-go-docs.js
